name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.24 is the floor: the root package re-exports Page[T] as a generic
        # type alias.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # The live harness skips itself without DIFY_HOST and console
      # credentials, so this runs the offline tests only.
      - run: go test -race ./...
