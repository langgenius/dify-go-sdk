app:
  name: sdk-go-harness-workflow
  mode: workflow
  icon_type: emoji
  icon: 🤖
  icon_background: '#FFEAD5'
  description: Fixture app for the SDK harness.
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
workflow:
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 282
      data:
        type: start
        title: Start
        version: '1'
        retry_config:
          max_retries: 0
          retry_interval: 0
          retry_enabled: false
        variables:
        - variable: word
          label: word
          description: ''
          type: text-input
          required: true
          hide: false
          options: []
          allowed_file_types: []
          allowed_file_extensions: []
          allowed_file_upload_methods: []
        - variable: note
          label: note
          description: ''
          type: paragraph
          required: false
          hide: false
          options: []
          allowed_file_types: []
          allowed_file_extensions: []
          allowed_file_upload_methods: []
    - id: shout
      type: custom
      position:
        x: 384
        y: 282
      data:
        type: template-transform
        title: Shout
        version: '1'
        retry_config:
          max_retries: 0
          retry_interval: 0
          retry_enabled: false
        variables:
        - variable: word
          value_selector:
          - start
          - word
        template: '{{ word }}!'
    - id: end
      type: custom
      position:
        x: 688
        y: 282
      data:
        type: end
        title: End
        version: '1'
        retry_config:
          max_retries: 0
          retry_interval: 0
          retry_enabled: false
        outputs:
        - variable: out
          value_type: any
          value_selector:
          - shout
          - output
        - variable: echo
          value_type: any
          value_selector:
          - start
          - word
    edges:
    - id: start-source-shout
      source: start
      target: shout
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: template-transform
        isInIteration: false
        isInLoop: false
    - id: shout-source-end
      source: shout
      target: end
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: template-transform
        targetType: end
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 1
  features: {}
  environment_variables: []
  conversation_variables: []
