app:
  name: sdk-go-harness-chatflow
  mode: advanced-chat
  icon_type: emoji
  icon: 🤖
  icon_background: '#FFEAD5'
  description: Fixture app for the SDK harness.
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
workflow:
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 282
      data:
        type: start
        title: Start
        version: '1'
        retry_config:
          max_retries: 0
          retry_interval: 0
          retry_enabled: false
        variables:
        - variable: topic
          label: topic
          description: ''
          type: text-input
          required: true
          hide: false
          options: []
          allowed_file_types: []
          allowed_file_extensions: []
          allowed_file_upload_methods: []
    - id: reply
      type: custom
      position:
        x: 384
        y: 282
      data:
        type: template-transform
        title: Template
        version: '1'
        retry_config:
          max_retries: 0
          retry_interval: 0
          retry_enabled: false
        variables:
        - variable: topic
          value_selector:
          - start
          - topic
        template: about {{ topic }}
    - id: answer
      type: custom
      position:
        x: 688
        y: 282
      data:
        type: answer
        title: Answer
        version: '1'
        retry_config:
          max_retries: 0
          retry_interval: 0
          retry_enabled: false
        answer: '{{#reply.output#}}'
    edges:
    - id: start-source-reply
      source: start
      target: reply
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: template-transform
        isInIteration: false
        isInLoop: false
    - id: reply-source-answer
      source: reply
      target: answer
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: template-transform
        targetType: answer
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 1
  features: {}
  environment_variables: []
  conversation_variables: []
