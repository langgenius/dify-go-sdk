kind: rag_pipeline
version: 0.1.0
rag_pipeline:
  name: sdk-go-harness-pipeline
  description: built by the Go SDK harness
  icon: 📙
  icon_type: emoji
  icon_background: '#FFEAD5'
workflow:
  graph:
    nodes:
    - id: datasource
      type: custom
      position:
        x: 80
        y: 282
      data:
        type: datasource
        title: File
        version: '1'
        retry_config:
          max_retries: 0
          retry_interval: 0
          retry_enabled: false
        plugin_id: langgenius/file
        provider_name: file
        provider_type: local_file
        datasource_name: upload-file
    - id: knowledge_index
      type: custom
      position:
        x: 384
        y: 282
      data:
        type: knowledge-index
        title: Knowledge Base
        version: '1'
        retry_config:
          max_retries: 0
          retry_interval: 0
          retry_enabled: false
        chunk_structure: text_model
        index_chunk_variable_selector:
        - datasource
        - file
        indexing_technique: economy
        retrieval_model:
          search_method: keyword_search
          top_k: 3
          score_threshold_enabled: false
          score_threshold: null
          reranking_enable: false
          reranking_mode: reranking_model
          reranking_model: null
          weights: null
    edges:
    - id: datasource-source-knowledge_index
      source: datasource
      target: knowledge_index
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: datasource
        targetType: knowledge-index
        isInIteration: false
        isInLoop: false
    viewport:
      x: 0
      y: 0
      zoom: 1
  features: {}
  environment_variables: []
  conversation_variables: []
  rag_pipeline_variables: []
